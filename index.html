<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Campus Impact Hub — Platform Ekosistem Kampus & Dampak Sosial</title>
  <meta name="description" content="Super App Ekosistem Kampus: Integrasi pengabdian masyarakat, marketplace proyek sosial, organisasi kampus, event dan portofolio dampak terukur.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233B49DF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M22 10v6M2 10l10-5 10 5-10 5z'/><path d='M6 12v5c3 3 9 3 12 0v-5'/></svg>">
  
  <!-- Professional Enterprise Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="logged-out">

  <!-- Top Header / App Bar (Visible when Logged In) -->
  <header class="app-header">
    <div class="brand-section" id="brandLogo">
      <div class="brand-logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>CAMPUS IMPACT HUB</h1>
        <p>Ekosistem Kampus & Dampak Sosial</p>
      </div>
    </div>

    <div class="header-right">
      <div class="header-pill impact" id="headerImpactPill" title="Lihat Impact Score">
        <span class="indicator-dot"></span>
        <span>Impact: <strong>0</strong></span>
      </div>
      <div class="header-pill leadership" id="headerLeadershipPill" title="Lihat Leadership Score">
        <span class="indicator-dot"></span>
        <span>Leadership: <strong>0</strong></span>
      </div>
      <div class="header-pill" id="headerRoleBadge" title="Peran Akun Terautentikasi">
        <span class="indicator-dot"></span>
        <span id="btnRoleSwitcherLabel">Mahasiswa</span>
      </div>
      <button class="btn-header-logout" id="btnHeaderLogout" title="Keluar dari Akun">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" x2="9" y1="12" y2="12"/>
        </svg>
        <span>Keluar</span>
      </button>
    </div>
  </header>

  <!-- Main App Layout -->
  <div class="app-layout">
    <!-- Desktop Navigation Sidebar (Dynamically Adapted to Active Role) -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-user-card" id="sidebarUserCard" title="Lihat profil pengguna">
        <div class="avatar-circle" id="sidebarAvatar">BS</div>
        <div class="sidebar-user-info">
          <div class="name" id="sidebarUserName">Budi Santoso</div>
          <div class="role-badge" id="sidebarUserRole">Mahasiswa</div>
          <div class="role-unit" id="sidebarUserUnit">S1 Teknik Informatika</div>
        </div>
      </div>

      <!-- Role Specific Quick Action -->
      <div id="sidebarQuickAction" class="sidebar-quick-action"></div>

      <!-- Role Specific Menu Header -->
      <div class="sidebar-section-label" id="sidebarMenuHeading">MENU MAHASISWA</div>

      <ul class="nav-menu" id="sidebarNavMenu">
        <!-- Rendered dynamically per role by js/app.js -->
      </ul>

      <div class="sidebar-footer" id="sidebarFooter">
        <div class="sidebar-db-badge" id="sidebarDbBadge" title="Klik untuk melihat status Database">
          <span class="db-dot online" id="sidebarDbDot"></span>
          <span id="sidebarDbText">PostgreSQL 16 (Docker)</span>
        </div>
        <div style="margin-top: 8px; display: flex; align-items: center; gap: 8px;">
          <img src="assets/breakbuild-labs-logo.png" alt="BreakBuild-Labs" style="width: 22px; height: 22px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border-color);">
          <div style="line-height: 1.25;">
            <div><strong>Campus Impact Hub</strong></div>
            <div style="font-size: 11px;">by <strong>BreakBuild-Labs</strong></div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Container -->
    <main class="main-content">
      <div id="contentContainer">
        <!-- Rendered dynamically by js/app.js -->
      </div>
    </main>
  </div>

  <!-- Mobile Bottom Navigation Bar (Visible when Logged In, Role-Adapted) -->
  <nav class="bottom-nav">
    <ul class="bottom-nav-tabs" id="bottomNavTabs">
      <!-- Rendered dynamically per role by js/app.js -->
    </ul>
  </nav>

  <!-- Interactive Modal Backdrop & Container -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-container" id="modalContainer">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Modal Title</h3>
        <button class="btn-close-modal" id="btnCloseModal" aria-label="Tutup">&times;</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Dynamic Modal Content -->
      </div>
      <div class="modal-footer" id="modalFooter">
        <!-- Dynamic Footer Action Buttons -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ES6 Module Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
