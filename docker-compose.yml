services:
  db:
    image: postgres:16-alpine
    container_name: campus-impact-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus_user
      POSTGRES_PASSWORD: campus_pass123
      POSTGRES_DB: campus_impact_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_user -d campus_impact_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus-impact-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://campus_user:campus_pass123@db:5432/campus_impact_db
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  app_data:
